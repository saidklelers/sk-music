name: Checks

# Tipos, lint y tests en cada PR y en cada push a main. Es rápido (no compila
# nada nativo) y atrapa lo que el workflow del APK sólo descubriría tras varios
# minutos de Gradle, o no descubriría nunca.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Los tests importan los .ts directamente: Node 22.18+ quita los
          # tipos sin necesidad de compilar.
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test
